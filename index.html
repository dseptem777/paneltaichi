<style>
:root {
  color-scheme: light;
  --bg: #DCEEE2; --card: #FFFFFF; --ink: #1C2420; --muted: #5B655F; --line: #E1E4DF;
  --pastel: #9AD7B4; --pastel-borde: #7FC49C; --pastel-suave: #DDF1E4; --pista: #E9ECE8;
  --verde-texto: #2F6B57; --verde-oscuro: #1F3A2E;
  --debe: #9A4A0B; --debe-bg: #FCEFE2; --off: #8A938D; --off-borde: #B5BBB7;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink); font-family: Figtree, system-ui, sans-serif; font-size: 17px; -webkit-tap-highlight-color: transparent; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--verde-texto); }
#app { max-width: 520px; margin: 0 auto; min-height: 100vh; padding-bottom: 92px; }
header { padding: 22px 20px 10px; display: flex; flex-direction: column; gap: 4px; }
.sub { margin: 0; font-size: 15px; color: var(--muted); font-weight: 500; }
h1 { margin: 0; font-size: 30px; font-weight: 700; letter-spacing: -0.4px; }
h2 { margin: 0; font-size: 19px; font-weight: 700; }
main { padding: 6px 20px 20px; display: flex; flex-direction: column; gap: 16px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; }
.fila { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.muted { color: var(--muted); }
.chico { font-size: 14px; }
.grande { font-size: 28px; font-weight: 700; }
.pista { height: 10px; background: var(--pista); border-radius: 5px; overflow: hidden; }
.pista > div { height: 100%; background: var(--pastel); border-radius: 5px; }
.volver { background: none; border: 0; padding: 0; min-height: 44px; display: flex; align-items: center; font-size: 16px; font-weight: 600; color: var(--verde-texto); cursor: pointer; align-self: flex-start; }
.btn { min-height: 52px; border-radius: 14px; border: 2px solid var(--pastel-borde); background: var(--pastel); color: var(--verde-oscuro); font-size: 17px; font-weight: 700; cursor: pointer; padding: 0 16px; display: flex; align-items: center; justify-content: center; text-align: center; text-decoration: none; }
.btn.sec { background: var(--card); color: var(--verde-texto); }
.btn:disabled { opacity: .6; cursor: default; }
.clase { display: flex; align-items: center; gap: 14px; background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px; min-height: 72px; text-align: left; width: 100%; cursor: pointer; }
.clase .hora { font-size: 22px; font-weight: 700; width: 64px; flex-shrink: 0; }
.clase .txt { display: flex; flex-direction: column; align-items: flex-start; gap: 4px; flex-grow: 1; min-width: 0; }
.clase .txt .chip { margin-top: 2px; }
.chip { font-size: 13px; font-weight: 700; padding: 6px 10px; border-radius: 999px; background: var(--pastel-suave); color: var(--verde-oscuro); white-space: nowrap; }
.chip.fuerte { background: var(--pastel); }
.chip.debe { background: var(--debe-bg); color: var(--debe); }
.aviso { display: flex; align-items: center; gap: 12px; background: var(--debe-bg); color: #7A3A08; border: 0; border-radius: 16px; padding: 14px 16px; font-size: 16px; font-weight: 600; text-align: left; cursor: pointer; width: 100%; }
.lista { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.alumno { display: flex; align-items: center; gap: 10px; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 8px 8px 8px 14px; min-height: 64px; }
.alumno .nom { display: flex; flex-direction: column; gap: 2px; flex-grow: 1; background: none; border: 0; padding: 6px 0; text-align: left; cursor: pointer; min-height: 44px; justify-content: center; }
.alumno .nom b { font-size: 17px; font-weight: 600; }
.estado { font-size: 14px; font-weight: 600; }
.ok { color: var(--verde-texto); }
.mal { color: var(--debe); }
.tilde { width: 52px; height: 52px; border-radius: 12px; border: 2px solid var(--off-borde); background: var(--card); color: var(--off); display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; }
.tilde[aria-pressed="true"] { background: var(--pastel); border-color: var(--pastel-borde); color: var(--verde-oscuro); }
label { font-size: 15px; font-weight: 600; }
.campo { display: flex; flex-direction: column; gap: 6px; }
input[type=text], input[type=date], input[type=time], input[type=search], input[type=tel], select, textarea { font-size: 17px; padding: 12px 14px; border: 1px solid var(--off-borde); border-radius: 12px; background: var(--card); min-height: 52px; width: 100%; }
input.monto { font-size: 26px; font-weight: 700; border: 2px solid var(--pastel-borde); }
textarea { min-height: 80px; resize: vertical; }
.dos { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.tres { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.opcion { min-height: 52px; border-radius: 12px; border: 2px solid var(--off-borde); background: var(--card); font-size: 17px; font-weight: 600; cursor: pointer; }
.opcion[aria-pressed="true"] { background: var(--pastel); border-color: var(--pastel-borde); color: var(--verde-oscuro); }
.filtros { display: flex; flex-wrap: wrap; gap: 8px; }
.filtros.horas { gap: 6px; }
.filtros.horas button { padding: 0 10px; }
.filtros button { flex-shrink: 0; min-height: 40px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--off-borde); background: var(--card); font-size: 15px; font-weight: 600; cursor: pointer; }
.filtros button[aria-pressed="true"] { background: var(--pastel); border-color: var(--pastel-borde); color: var(--verde-oscuro); }
.dianav { display: flex; align-items: center; gap: 4px; }
.dianav button { width: 44px; height: 44px; border-radius: 12px; border: 1px solid var(--line); background: var(--card); font-size: 20px; font-weight: 700; cursor: pointer; color: var(--verde-texto); }
.puntos { display: flex; flex-wrap: wrap; gap: 6px; }
.puntos span { font-size: 13px; font-weight: 600; padding: 4px 8px; border-radius: 8px; background: var(--pastel-suave); color: var(--verde-oscuro); }
.puntos button { font: inherit; font-size: 16px; font-weight: 700; min-height: 44px; padding: 0 14px; border: 0; border-radius: 10px; background: var(--pastel-suave); color: var(--verde-oscuro); cursor: pointer; }
.pres-lista { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.pres-lista li { font-size: 20px; font-weight: 600; padding: 10px 4px; border-bottom: 1px solid var(--line); overflow-wrap: anywhere; }
.pres-lista li:last-child { border-bottom: 0; }
.parte-lista { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.parte-lista li, .parte-tot div { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; padding: 5px 0; border-bottom: 1px solid var(--line); font-size: 17px; line-height: 1.3; }
.parte-lista li, .parte-tot div { flex-wrap: wrap; column-gap: 10px; row-gap: 0; }
.parte-lista li span { flex: 1 1 0; min-width: min-content; overflow-wrap: break-word; }
.parte-lista b, .parte-tot b { white-space: nowrap; margin-left: auto; }
.parte-tot { display: flex; flex-direction: column; border-top: 2px solid var(--verde-texto); }
.parte-tot div { font-weight: 700; flex-wrap: wrap; }
.parte-tot .parte-va { border-bottom: 0; font-size: 20px; color: var(--verde-texto); }
.err { color: var(--debe); font-size: 15px; font-weight: 600; margin: 0; }
.vacio { text-align: center; color: var(--muted); padding: 24px 8px; margin: 0; }
nav.barra { position: fixed; left: 0; right: 0; bottom: 0; background: var(--card); border-top: 1px solid var(--line); padding: 6px 4px calc(10px + env(safe-area-inset-bottom)); }
nav.barra > div { max-width: 520px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); }
nav.barra button { background: none; border: 0; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 8px 0; min-height: 48px; color: var(--muted); font-size: 13px; font-weight: 500; cursor: pointer; }
nav.barra button[aria-current="page"] { color: var(--verde-texto); font-weight: 700; }
.tuto-fondo { position: fixed; inset: 0; background: rgba(28, 36, 32, .55); z-index: 10; display: flex; align-items: flex-end; justify-content: center; }
.tuto { background: var(--bg); width: 100%; max-width: 520px; border-radius: 24px 24px 0 0; padding: 20px 20px calc(20px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 14px; max-height: 92vh; overflow: auto; }
.tuto h2 { font-size: 24px; }
.tuto p { margin: 0; font-size: 18px; line-height: 1.45; }
.tuto .demo { pointer-events: none; background: var(--card); border: 1px dashed var(--off-borde); border-radius: 16px; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
.tuto-pasos { display: flex; gap: 6px; justify-content: center; }
.tuto-pasos span { width: 8px; height: 8px; border-radius: 4px; background: var(--off-borde); }
.tuto-pasos span.on { width: 22px; background: var(--verde-texto); }
.dianav { flex-shrink: 0; margin-left: auto; }
/* Con pantalla chica o letra grande, la fecha y los botones de arriba bajan de renglón en vez de salirse. */
header .fila { flex-wrap: wrap; row-gap: 8px; }
/* Fila de pasar lista: el tilde siempre a la derecha y "Cobrar" debajo del nombre, así entra con letra grande. */
.alumno.conTilde { display: grid; grid-template-columns: minmax(0, 1fr) auto; column-gap: 10px; align-items: center; }
.alumno.conTilde .tilde { grid-column: 2; grid-row: 1 / span 2; }
.alumno.conTilde .cobrar { grid-column: 1; grid-row: 2; justify-self: start; margin-bottom: 6px; }
.dianav button.ayuda { width: auto; height: 44px; padding: 0 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--card); font-size: 15px; font-weight: 700; color: var(--verde-texto); cursor: pointer; }
.logo { width: 52px; height: 52px; border-radius: 50%; flex-shrink: 0; box-shadow: 0 0 0 2px #fff, 0 1px 4px rgba(28,36,32,.18); background: #fff; }
.logo.grande { width: 120px; height: 120px; }
#toast { position: fixed; left: 50%; bottom: 96px; transform: translateX(-50%); background: var(--verde-oscuro); color: #fff; padding: 12px 18px; border-radius: 12px; font-weight: 600; font-size: 15px; display: none; max-width: 90vw; text-align: center; z-index: 5; }
#toast.mal { background: var(--debe); }
.estado-sync { font-size: 14px; color: var(--muted); background: none; border: 0; padding: 0; cursor: pointer; text-align: left; min-height: 44px; display: flex; align-items: center; }
/* Avisos que se quedan hasta que Héctor los ve (un cobro que la planilla no aceptó, una clase que no es de hoy). */
.franja { background: var(--debe-bg); color: #7A3A08; border-radius: 12px; padding: 10px 14px; font-size: 15px; font-weight: 600; margin: 0; }
.rechazo { display: flex; flex-direction: column; gap: 8px; background: var(--debe-bg); color: #7A3A08; border-radius: 16px; padding: 12px 14px; font-size: 15px; font-weight: 600; }
.rechazo .btn { min-height: 44px; font-size: 15px; }
/* Dos botones que con letra grande bajan de renglón en vez de cortarse. */
.medios { display: flex; flex-wrap: wrap; gap: 8px; }
.medios .opcion { flex: 1 1 8em; }
.dias7 { display: flex; flex-wrap: wrap; gap: 6px; }
.dias7 .opcion { flex: 1 0 44px; padding: 0; }
.btn.peligro { background: var(--card); border-color: var(--debe); color: var(--debe); }
.pregunta { display: flex; flex-direction: column; gap: 10px; background: var(--card); border: 2px solid var(--pastel-borde); border-radius: 16px; padding: 14px; }
.pregunta .opcion { text-align: left; padding: 10px 14px; line-height: 1.3; }
.pregunta .opcion small { display: block; font-size: 14px; font-weight: 500; color: var(--muted); }
.estado-sync.mal { color: var(--debe); font-weight: 600; }
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" role="status" aria-live="polite"></div>
<script>
(function () {
  'use strict';

  // ---------- Conexión (igual que Gastos al Toke) ----------
  var CLAVE_LS = 'taichi_conexion';
  function leerCfg() { try { return JSON.parse(localStorage.getItem(CLAVE_LS) || 'null'); } catch (e) { return null; } }
  function guardarCfg(c) { try { localStorage.setItem(CLAVE_LS, JSON.stringify(c)); } catch (e) {} }
  var cfg = leerCfg();
  // Lo que se va escribiendo en Conectar: sobrevive a redibujar la pantalla y a que el celular recargue la página
  // al cambiar de app (Héctor copiaba la dirección, iba a WhatsApp por la clave y al volver estaba todo vacío).
  var BORR_LS = 'taichi_conectar_borrador';
  function leerBorrConn() { try { return JSON.parse(localStorage.getItem(BORR_LS) || 'null'); } catch (e) { return null; } }
  function guardarBorrConn(b) { try { if (b) localStorage.setItem(BORR_LS, JSON.stringify(b)); else localStorage.removeItem(BORR_LS); } catch (e) {} }

  // POST como text/plain: evita el preflight de CORS que Apps Script no responde.
  function llamar(accion, datos, c) {
    c = c || cfg;
    var cuerpo = Object.assign({ accion: accion, token: c.token }, datos || {});
    // red = true: no se llegó a la planilla (sin señal, wifi con portal, etc.). Se puede reintentar.
    function deRed(m) { var e = new Error(m); e.red = true; return e; }
    // raro = sí hubo señal pero no contestó la planilla (falla de Google, permisos, URL vieja). También se reintenta.
    function raro(m) { var e = new Error(m); e.raro = true; return e; }
    return fetch(c.url, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(cuerpo) })
      .catch(function () { throw deRed('Sin conexión'); })
      .then(function (r) { return r.json().catch(function () { throw raro('La planilla no respondió bien. ¿La dirección es la /exec?'); }); })
      .then(function (j) {
        if (!j.ok) { var e = new Error(j.error || 'Error desconocido'); e.tipo = j.tipo || tipoViejo(j.error); throw e; }
        return j.data;
      });
  }
  // Por si el Apps Script todavía es el de antes (no manda tipo).
  function tipoViejo(m) {
    m = String(m || '');
    if (m === 'Clave incorrecta') return 'clave';
    if (/lock|timeout|too many|service|servicio|exceeded|tiempo|internal/i.test(m)) return 'temporal';
    return 'datos';
  }
  // Errores que no son culpa del pedido: lo que estaba en la cola sigue ahí y se vuelve a mandar.
  function sinSenalReal(e) { return e.red && !e.raro; }

  // ---------- Fechas y formatos ----------
  var DIAS = ['D', 'L', 'M', 'X', 'J', 'V', 'S'];
  var NOMBRE_DIA = ['Domingo', 'Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes', 'Sábado'];
  var MESES = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];
  function p2(n) { return (n < 10 ? '0' : '') + n; }
  function iso(d) { return d.getFullYear() + '-' + p2(d.getMonth() + 1) + '-' + p2(d.getDate()); }
  function hoy() { return iso(new Date()); }
  function deIso(s) { var a = s.split('-').map(Number); return new Date(a[0], a[1] - 1, a[2]); }
  function mesDe(f) { return f.slice(0, 7); }
  function sumarDias(f, n) { var d = deIso(f); d.setDate(d.getDate() + n); return iso(d); }
  function sumarMes(m, n) { var a = m.split('-').map(Number); var d = new Date(a[0], a[1] - 1 + n, 1); return d.getFullYear() + '-' + p2(d.getMonth() + 1); }
  function nombreMes(m) { var a = m.split('-').map(Number); var t = MESES[a[1] - 1]; return t.charAt(0).toUpperCase() + t.slice(1) + ' ' + a[0]; }
  function fechaLarga(f) { var d = deIso(f); return NOMBRE_DIA[d.getDay()] + ' ' + d.getDate() + ' de ' + MESES[d.getMonth()]; }
  function fechaCorta(f) { var d = deIso(f); return d.getDate() + '/' + (d.getMonth() + 1); }
  function plata(n) { return '$' + Math.round(n).toLocaleString('es-AR'); }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function id() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
  function soloNumero(s) { return Number(String(s || '').replace(/\D/g, '')) || 0; }
  function iniciales(n) { return n.split(/\s+/).filter(Boolean).slice(0, 2).map(function (x) { return x.charAt(0).toUpperCase(); }).join(''); }

  // ---------- Estado ----------
  var D = null;          // { planilla, grupos, alumnos, pagos, asistencias }
  var mesCargado = null; // mes de las asistencias que hay en D
  var S = {
    vista: cfg ? 'hoy' : 'conectar',
    fecha: hoy(), grupo: null, alumno: null, mesPanel: mesDe(hoy()), mesCobro: mesDe(hoy()),
    buscar: '', filtroGrupo: '', verBajas: false,
    pago: null, edit: null, borrarId: null,
    cargando: false, error: null, ultima: null, sinSenal: false, claveMal: false, errorCola: null,
    volver: 'hoy'
  };

  function mesActivo() { return (S.vista === 'panel' || S.vista === 'asist' || S.vista === 'parte') ? S.mesPanel : mesDe(S.fecha); }

  // ---------- Sin conexión ----------
  // Presentes y cobros nuevos van primero a una cola guardada en el celular y se mandan
  // en orden cuando hay señal. Los últimos datos descargados también quedan guardados,
  // así la app abre aunque no haya señal. Editar/borrar pagos y alumnos necesitan señal.
  var COLA_LS = 'taichi_cola', CACHE_LS = 'taichi_datos', RECH_LS = 'taichi_rechazados';
  function leerLS(k, def) { try { return JSON.parse(localStorage.getItem(k) || 'null') || def; } catch (e) { return def; } }
  function escribirLS(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  var cola = leerLS(COLA_LS, []);
  function guardarCola() { escribirLS(COLA_LS, cola); }
  // Lo que la planilla no aceptó (dato inválido): no se tira en silencio, queda a la vista hasta que Héctor toca "Entendido".
  var rechazos = leerLS(RECH_LS, []);
  function guardarRechazos() { escribirLS(RECH_LS, rechazos); }
  // Cuenta lo que llegó a la planilla. Si cambia mientras baja un "todo", lo que bajó ya es viejo.
  var cambios = 0;
  function guardarCache() { if (D && S.ultima) escribirLS(CACHE_LS, { D: D, mes: mesCargado, t: S.ultima.getTime() }); }
  function claveP(d) { return d.fecha + '|' + d.grupo + '|' + d.alumno; }

  function aplicarPresente(d, on) {
    D.asistencias = D.asistencias.filter(function (x) { return claveP(x) !== claveP(d); });
    if (on) D.asistencias.push({ fecha: d.fecha, grupo: d.grupo, alumno: d.alumno });
  }
  // Vuelve a aplicar sobre datos recién bajados lo que todavía no llegó a la planilla.
  function aplicarCola() {
    cola.forEach(function (it) {
      if (it.accion === 'presente') aplicarPresente(it.datos, it.datos.on);
      if (it.accion === 'pagar' && !D.pagos.some(function (p) { return p.id === it.datos.p.id; })) D.pagos.push(Object.assign({}, it.datos.p));
      if (it.accion === 'editarPago') { var x = D.pagos.find(function (p) { return p.id === it.datos.p.id; }); if (x) Object.assign(x, it.datos.p); }
      if (it.accion === 'borrarPago') D.pagos = D.pagos.filter(function (p) { return p.id !== it.datos.id; });
    });
  }
  function encolar(accion, datos) {
    var it = { accion: accion, datos: datos };
    if (accion === 'presente') {
      // Si ese presente ya estaba esperando, vale el último toque.
      var i = cola.findIndex(function (x) { return x.accion === 'presente' && claveP(x.datos) === claveP(datos); });
      if (i >= 0) { cola[i] = it; guardarCola(); return vaciarCola(); }
    }
    cola.push(it); guardarCola();
    return vaciarCola();
  }
  function falloCola(it, e) {
    var txt;
    if (it.accion === 'pagar') {
      var p = it.datos.p, a = alumno(p.alumno);
      D.pagos = D.pagos.filter(function (x) { return x.id !== p.id; });
      txt = 'No se guardó el pago de ' + (a ? a.nombre : '') + ' (' + plata(p.monto) + ', ' + MESES[Number(p.mes.slice(5)) - 1] + ', ' + p.medio + ')';
    } else if (it.accion === 'presente') {
      aplicarPresente(it.datos, !it.datos.on);
      var b = alumno(it.datos.alumno);
      txt = 'No se guardó el presente de ' + (b ? b.nombre : '') + ' del ' + fechaCorta(it.datos.fecha);
    } else if (it.accion === 'editarPago') {
      var c = alumno(it.datos.p.alumno);
      txt = 'No se guardó la corrección del pago de ' + (c ? c.nombre : '') + ' (' + plata(it.datos.p.monto) + ')';
    } else if (it.accion === 'borrarPago') {
      txt = 'No se pudo borrar un pago';
    } else txt = 'No se guardó un cambio';
    rechazos.push({ txt: txt + '. La planilla dijo: ' + e.message + '.', t: Date.now() });
    guardarRechazos();
  }
  var enviando = null;
  function vaciarCola() {
    if (enviando) return enviando;
    function paso() {
      if (!cola.length || !cfg || S.claveMal) return Promise.resolve();
      var it = cola[0];
      return llamar(it.accion, it.datos).then(function () {
        if (cola[0] === it) cola.shift();
        cambios++; guardarCola(); S.sinSenal = false; S.errorCola = null; guardarCache();
        return paso();
      }, function (e) {
        // Sin señal, o la planilla no pudo (bloqueo, límite de Google): queda en la cola y se reintenta.
        if (sinSenalReal(e)) { S.sinSenal = true; return; }
        if (e.raro || e.tipo === 'temporal') { S.sinSenal = false; S.errorCola = e.message; return; }
        // Clave cambiada: se frena todo sin borrar nada, hasta que se vuelva a conectar.
        if (e.tipo === 'clave') { S.claveMal = true; return; }
        // Dato inválido: la planilla no lo va a aceptar nunca. Sale de la cola, pero queda el aviso.
        if (cola[0] === it) cola.shift();
        guardarCola(); falloCola(it, e); guardarCache();
        return paso();
      });
    }
    enviando = paso().then(function () { enviando = null; render(); });
    return enviando;
  }

  function cargar(mes) {
    mes = mes || mesActivo();
    S.cargando = true;
    var antes, viejo = false;
    // Primero se manda lo pendiente, así lo que baja ya lo incluye.
    return vaciarCola().then(function () { antes = cambios; return llamar('todo', { mes: mes }); }).then(function (d) {
      // Si mientras bajaba llegó algo nuevo a la planilla (un cobro, un presente), esto ya es viejo: se pide de nuevo.
      if (cambios !== antes) { viejo = true; return; }
      D = d; mesCargado = mes; S.ultima = new Date(); S.error = null; S.sinSenal = false;
      aplicarCola(); guardarCache();
    }).catch(function (e) {
      S.error = e.message;
      if (sinSenalReal(e)) S.sinSenal = true;
      if (e.tipo === 'clave') S.claveMal = true;
    }).then(function () {
      S.cargando = false; render();
      if (viejo) return cargar(mes);
      // Si mientras cargaba se cambió de mes, traer el que se está mirando ahora.
      if (!S.error && mesActivo() !== mesCargado) cargar();
    });
  }

  function asegurarMes() { if (cfg && mesActivo() !== mesCargado && !S.cargando) cargar(); }

  // ---------- Consultas sobre los datos ----------
  function grupo(gid) { return D.grupos.find(function (g) { return g.id === gid; }); }
  // Grupos abiertos (los cerrados siguen en D.grupos para los meses pasados). Sin campo activo = abierto.
  function abiertos() { return D.grupos.filter(function (g) { return g.activo !== false; }); }
  function porHora(a, b) { return a.sede.localeCompare(b.sede, 'es') || horaNum(a.hora) - horaNum(b.hora); }
  function alumno(aid) { return D.alumnos.find(function (a) { return a.id === aid; }); }
  function porNombre(a, b) { return a.nombre.localeCompare(b.nombre, 'es'); }
  function alumnosDe(gid) { return D.alumnos.filter(function (a) { return a.activo && a.grupo === gid; }).sort(porNombre); }
  function gruposDelDia(f) {
    var letra = DIAS[deIso(f).getDay()];
    return abiertos().filter(function (g) { return g.dias.split(',').map(function (x) { return x.trim().toUpperCase(); }).indexOf(letra) >= 0; })
      .sort(function (a, b) { return horaNum(a.hora) - horaNum(b.hora); });
  }
  function horaNum(h) { var a = String(h).split(':').map(Number); return (a[0] || 0) * 60 + (a[1] || 0); }
  function pagado(aid, mes) { return D.pagos.filter(function (p) { return p.alumno === aid && p.mes === mes; }).reduce(function (s, p) { return s + p.monto; }, 0); }
  // Los que vinieron a esta clase desde otro grupo (recuperan): tienen presente acá pero no son del grupo.
  // También los que Héctor acaba de sumar y destildó (S.recup), para que no desaparezcan de la lista.
  function recuperanEn(f, gid) {
    var del = {}; alumnosDe(gid).forEach(function (a) { del[a.id] = true; });
    var ids = [];
    D.asistencias.forEach(function (x) { if (x.fecha === f && x.grupo === gid && !del[x.alumno] && ids.indexOf(x.alumno) < 0) ids.push(x.alumno); });
    if (S.recup && S.recup.clave === f + '|' + gid) S.recup.ids.forEach(function (i) { if (!del[i] && ids.indexOf(i) < 0) ids.push(i); });
    return ids.map(alumno).filter(Boolean).sort(porNombre);
  }
  // Promedio de presentes por clase (clases = fechas con algún presente). "6,5"; sin clases, null.
  function promedio(presentes, clases) {
    if (!clases) return null;
    var x = Math.round(presentes / clases * 10) / 10;
    return String(x).replace('.', ',');
  }
  function presentesSet(f, gid) {
    var s = {};
    D.asistencias.forEach(function (x) { if (x.fecha === f && x.grupo === gid) s[x.alumno] = true; });
    return s;
  }
  // Cuota, grupo y estado de un alumno en un mes, según la pestaña Historial.
  // Sin historial: sus valores actuales. Con historial pero sin fila hasta ese mes: todavía no era alumno.
  function valoresEn(a, mes) {
    var mejor = null, hay = false;
    (D.historial || []).forEach(function (h) {
      if (h.alumno !== a.id) return;
      hay = true;
      if (h.desde <= mes && (!mejor || h.desde > mejor.desde)) mejor = h;
    });
    if (!hay) return { cuota: a.cuota, grupo: a.grupo, activo: a.activo };
    if (!mejor) return { cuota: 0, grupo: a.grupo, activo: false };
    return { cuota: mejor.cuota, grupo: mejor.grupo, activo: mejor.activo };
  }
  function estadoPago(a, mes) {
    var cuota = valoresEn(a, mes).cuota;
    if (!cuota) return { cls: 'muted', txt: 'Sin cuota cargada', debe: false };
    var p = pagado(a.id, mes);
    if (p >= cuota) return { cls: 'ok', txt: 'Pagó ' + MESES[Number(mes.slice(5)) - 1], debe: false };
    if (p > 0) return { cls: 'mal', txt: 'Pagó ' + plata(p) + ' de ' + plata(cuota), debe: true };
    return { cls: 'mal', txt: 'Debe ' + MESES[Number(mes.slice(5)) - 1] + ' · ' + plata(cuota), debe: true };
  }
  function resumenMes(mes) {
    var esperado = 0, cobrado = 0, deben = [], grupos = {}, activos = 0, sinCuota = 0;
    D.grupos.forEach(function (g) { grupos[g.id] = { g: g, esperado: 0, cobrado: 0, alumnos: 0 }; });
    D.alumnos.forEach(function (a) {
      var v = valoresEn(a, mes);
      var gr = grupos[v.grupo];
      var p = pagado(a.id, mes);
      cobrado += p;
      if (gr) gr.cobrado += p;
      if (!v.activo) return;
      activos++;
      if (gr) gr.alumnos++;
      if (v.cuota > 0) {
        esperado += v.cuota;
        if (gr) gr.esperado += v.cuota;
        if (p < v.cuota) deben.push({ a: a, falta: v.cuota - p });
      } else sinCuota++;
    });
    deben.sort(function (x, y) { return porNombre(x.a, y.a); });
    return { esperado: esperado, cobrado: cobrado, deben: deben, activos: activos, sinCuota: sinCuota,
      grupos: Object.keys(grupos).map(function (k) { return grupos[k]; }) };
  }
  function pct(a, b) { return b > 0 ? Math.min(100, Math.round(a * 100 / b)) : 0; }
  // Lugares: "bonzi", "Bonzi " o "Bonzí" son el mismo.
  function normSede(x) { return String(x || '').trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/\s+/g, ' '); }
  // Parte que se le paga a un lugar (pestaña Sedes). Si D.sedes no vino, el Apps Script es viejo.
  function hayPartes() { return Array.isArray(D.sedes); }
  function parteDe(sede) { return (D.sedes || []).find(function (x) { return normSede(x.sede) === normSede(sede); }) || null; }
  function txtPct(n) { return String(n).replace('.', ',') + '%'; }
  // Lo cobrado de las cuotas de un mes en un lugar (mismo cálculo que el Panel por grupo), alumno por alumno.
  function resumenParte(sede, mes) {
    var gids = {}, filas = [], total = 0;
    D.grupos.forEach(function (g) { if (normSede(g.sede) === normSede(sede)) gids[g.id] = g; });
    D.alumnos.forEach(function (a) {
      var v = valoresEn(a, mes); if (!gids[v.grupo]) return;
      var p = pagado(a.id, mes); if (p <= 0) return;
      filas.push({ a: a, monto: p }); total += p;
    });
    filas.sort(function (x, y) { return porNombre(x.a, y.a); });
    var pa = parteDe(sede) || { porcentaje: 0, para: '' };
    return { grupos: Object.keys(gids).map(function (k) { return gids[k]; }), filas: filas, total: total, parte: pa, monto: Math.round(total * pa.porcentaje / 100) };
  }

  function sync() {

  function verRechazos() {
    return rechazos.map(function (r, k) {
      return '<div class="rechazo" role="alert"><span>' + esc(r.txt) + ' Fijate si hay que cargarlo de nuevo.</span><button class="btn sec" data-a="rechazoVisto" data-i="' + k + '">Entendido</button></div>';

  function estado() {
    if (S.cargando && !D) return '<p class="sub">Cargando…</p>';

    if (S.claveMal) return '<button class="estado-sync mal" data-a="ir" data-v="conectar">La clave no anda' + (n ? ': hay ' + cuantos + ', esperando' : '') + '. Tocá acá para volver a conectar.</button>';
    if (n && S.errorCola && !S.sinSenal) return '<button class="estado-sync mal" data-a="recargar">' + cuantos + '. La planilla no respondió (' + esc(S.errorCola) + '): se vuelve a probar sola.</button>';
    if (n) return '<button class="estado-sync mal" data-a="recargar">' + (S.sinSenal ? 'Sin señal. ' : 'Enviando… ') + cuantos +
      (S.sinSenal ? ': se mandan solos cuando vuelva la señal.' : '.') + '</button>';

  function vConectar() {

  // Pantalla de inicio: los grupos, sin plata (pedido de Héctor). Arriba las clases del día elegido.
  function tarjetaGrupo(g, f, deHoy) {
    var al = alumnosDe(g.id), pr = presentesSet(f, g.id), n = Object.keys(pr).length;
    return '<div class="clase" style="cursor:default;padding:0;overflow:hidden;align-items:stretch;gap:0">' +

      '<span class="muted chico">' + esc(diasLargos(g.dias)) + '</span>' +
      '<span class="muted chico">' + al.length + (al.length === 1 ? ' alumno' : ' alumnos') + (n ? ' · ' + n + (n === 1 ? ' presente' : ' presentes') : '') + '</span>' +

  function vHoy() {

  // Aviso de día sin clases, con la próxima clase (de cualquier grupo) en los 7 días siguientes
  function sinClases(f, esHoy) {
    var dia = NOMBRE_DIA[deIso(f).getDay()].toLowerCase();
    var t = esHoy ? 'Hoy no hay clases.' : 'El ' + dia + ' ' + fechaCorta(f) + ' no hay clases.';
    var prox = '';
    for (var k = 1; k <= 7; k++) {
      var d = sumarDias(f, k), gs = gruposDelDia(d);
      if (gs.length) {
        var cuando = (esHoy && k === 1 ? 'mañana ' : 'el ') + NOMBRE_DIA[deIso(d).getDay()].toLowerCase() + (esHoy && k === 1 ? '' : ' ' + fechaCorta(d));
        prox = 'La próxima: ' + cuando + ', ' + gs[0].hora + ' · ' + gs[0].sede + '.';
        break;
      }
    }
    return '<section class="card"><b style="font-size:20px">' + esc(t) + '</b>' + (prox ? '<span class="sub" style="margin:0">' + esc(prox) + '</span>' : '') + '</section>';
  }

  // ¿El grupo tiene clase ese día, según sus días?
  function tieneClase(g, f) {
    return g.dias.split(',').map(function (x) { return x.trim().toUpperCase(); }).indexOf(DIAS[deIso(f).getDay()]) >= 0;
  }
  // Clase siguiente (n=1) o anterior (n=-1) del grupo según sus días; null si no hay en 14 días
  function otraClase(g, f, n) {
    for (var k = 0; k < 14; k++) {
      f = sumarDias(f, n);
      if (tieneClase(g, f)) return f;
    }
    return null;
  }
  // Se puede tildar si la clase ya llegó y el grupo tiene clase ese día. Un día sin clase solo deja quitar
  // un presente que ya estaba (para poder corregir), nunca poner uno nuevo.
  function sePuedeTildar(g, f, on) { return f <= hoy() && (tieneClase(g, f) || !on); }

  function vLista() {

  // La lista de quién debe está solo acá. Con ‹ › se ven los meses anteriores (no hace falta señal: los pagos están todos).

  // Cambio de grupo, de cuota o de estado: ¿cuenta para este mes o recién para el que viene?
  function preguntaDesde(E) {
    var m = mesDe(hoy()), este = MESES[Number(m.slice(5)) - 1], prox = MESES[Number(sumarMes(m, 1).slice(5)) - 1];
    var o = E.orig || {}, titulo, detalle = [], ayuda;
    if (E.pregunta === 'estado') {
      titulo = E.activo ? '¿Dar de baja a ' + E.nombre.trim() + '?' : '¿Volver a dar de alta a ' + E.nombre.trim() + '?';
      ayuda = E.activo ? ['No figura más en ' + este + ' (ni como deudor).', 'Sigue contando en ' + este + ': si no pagó, lo sigue debiendo.']
        : ['Cuenta desde ' + este + ': si no pagó, figura como deudor.', 'Cuenta recién desde ' + prox + '.'];
    } else {
      titulo = '¿Desde cuándo vale el cambio?';
      if (E.cuota !== o.cuota) detalle.push('Cuota: ' + plata(o.cuota || 0) + ' → ' + plata(E.cuota || 0) + '.');
      if (E.grupo !== o.grupo) { var g1 = grupo(o.grupo), g2 = grupo(E.grupo); detalle.push('Grupo: ' + (g1 ? g1.nombre : '—') + ' → ' + (g2 ? g2.nombre : '—') + '.'); }
      ayuda = [este.charAt(0).toUpperCase() + este.slice(1) + ' ya cuenta con el cambio.',
        este.charAt(0).toUpperCase() + este.slice(1) + ' sigue como estaba' + (E.cuota !== o.cuota ? ' (si ya pagó ' + este + ' con la cuota de antes, es esta).' : '.')];
    }

      (detalle.length ? '<span class="muted">' + esc(detalle.join(' ')) + '</span>' : '') +
      '<button class="opcion" data-a="editDesde" data-vale="este"' + (E.guardando ? ' disabled' : '') + '>' + (E.pregunta === 'estado' ? 'Sí, ' : '') + 'desde este mes (' + este + ')<small>' + esc(ayuda[0]) + '</small></button>' +
      '<button class="opcion" data-a="editDesde" data-vale="proximo"' + (E.guardando ? ' disabled' : '') + '>' + (E.pregunta === 'estado' ? 'Sí, ' : '') + 'desde ' + prox + '<small>' + esc(ayuda[1]) + '</small></button>' +

  function vPanel() {

    if (mes !== mesCargado) return '<header><div class="fila"><p class="sub">' + esc(nombreMes(mes)) + '</p><div class="dianav"><button data-a="mesPanel" data-n="-1" aria-label="Mes anterior">‹</button><button data-a="mesPanel" data-n="1" aria-label="Mes siguiente">›</button></div></div><h1>Panel</h1>' + sync() + '</header><main><p class="vacio">' +

  // ---------- Asistencias de un grupo (desde Panel) ----------

    var del = D.asistencias.filter(function (x) { return x.grupo === g.id && mesDe(x.fecha) === mes; });
    var fechas = []; del.forEach(function (x) { if (fechas.indexOf(x.fecha) < 0) fechas.push(x.fecha); }); fechas.sort();
    var por = {}; del.forEach(function (x) { (por[x.alumno] = por[x.alumno] || []).push(x.fecha); });

      }).join('') + '</div>' : '') + '</section>';

        '<span class="estado ' + (n ? 'ok' : 'mal') + '">' + (n ? 'Vino a ' + n + ' de ' + fechas.length + (fechas.length === 1 ? ' clase' : ' clases') : 'No vino este mes') + '</span>' +
        (n ? '<span class="muted chico">' + fs.map(fechaCorta).join(' · ') + '</span>' : '') + '</button></li>';

    h += '</ul></section>';

    if (c === 'monto' || c === 'cuota') {

      e.target.value = dest[c] ? plata(dest[c]) : '';
    } else dest[c] = v;
  });
  document.addEventListener('change', function (e) {
    var c = e.target.dataset && e.target.dataset.campo; if (!c || c === 'buscar' || c === 'monto' || c === 'cuota') return;
    var dest = destino(); if (dest) dest[c] = e.target.value;
  });

  // Recargar al volver a la app y cada 5 minutos si queda abierta (antes manda lo pendiente).
  document.addEventListener('visibilitychange', function () { if (document.visibilityState !== 'visible') return; chequearDia(); render(); if (cfg && !S.cargando) cargar(); });
  setInterval(function () { chequearDia(); if (document.visibilityState === 'visible' && cfg && !S.cargando && !S.pago && !S.edit) cargar(); }, 5 * 60 * 1000);
  // Lo guardado en el celular se reintenta al volver la señal y cada 30 segundos.
  window.addEventListener('online', function () { if (cfg) vaciarCola(); });
  setInterval(function () { if (cfg && cola.length) vaciarCola(); }, 30 * 1000);

  // Arranque: si hay datos guardados se muestran ya (sirve sin señal) y se actualizan detrás.
  if (cfg) {
    var cache = leerLS(CACHE_LS, null);
    if (cache && cache.D) { D = cache.D; D.historial = D.historial || []; mesCargado = cache.mes; S.ultima = new Date(cache.t); aplicarCola(); }
  }
  render();
  if (cfg) cargar(mesDe(hoy()));
  // Para que abra sin señal (ver sw.js). Solo en la dirección publicada, no abriendo el archivo a mano.
  if ('serviceWorker' in navigator && location.protocol !== 'file:') navigator.serviceWorker.register('sw.js').catch(function () {});
})();
